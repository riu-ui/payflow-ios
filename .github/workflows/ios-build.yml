name: Build PAYFLOW iOS (unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Payflow/**"
      - "PAYFLOW.xcodeproj/**"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_15.app/Contents/Developer || sudo xcode-select -p

      - name: Build (unsigned)
        run: |
          xcodebuild -project PAYFLOW.xcodeproj \
            -scheme Payflow \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -r "build/Build/Products/Release-iphoneos/Payflow.app" Payload/
          zip -r PAYFLOW.ipa Payload
          ls -lh PAYFLOW.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: payflow-ios-unsigned-ipa
          path: PAYFLOW.ipa
          retention-days: 14
